<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Avanzada de Integrales</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.7.0/math.min.js"></script>
    <!-- Desmos API -->
    <script src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="assets/desmos-logo.png" height="30" class="d-inline-block align-top" alt="">
                Integrales Pro+
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#calculadora">Calculadora</a></li>
                    <li class="nav-item"><a class="nav-link" href="#graficos">Gráficos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#ejercicios">Ejercicios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Calculadora -->
        <section id="calculadora" class="mb-5">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Calculadora de Integrales</h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="inputFuncion" class="form-label">Función a integrar:</label>
                                <input type="text" id="inputFuncion" class="form-control" placeholder="Ej: x^2 + sin(x)">
                            </div>
                            <div class="d-grid gap-2 d-md-flex">
                                <button onclick="calcularMathJS()" class="btn btn-success me-md-2">
                                    Calcular con Math.js
                                </button>
                                <button onclick="calcularSymPy()" class="btn btn-warning">
                                    Calcular con SymPy
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div id="resultado" class="p-3 bg-light rounded">
                                <p class="text-muted">Los resultados aparecerán aquí...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Gráficos -->
        <section id="graficos" class="mb-5">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">Visualización Gráfica</h3>
                </div>
                <div class="card-body">
                    <div id="desmos-calculator" style="height: 500px; width: 100%;"></div>
                </div>
            </div>
        </section>

        <!-- Ejercicios -->
        <section id="ejercicios">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Ejercicios Interactivos</h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h4 id="preguntaEjercicio">\[ \int 2x \, dx \]</h4>
                            <div class="mb-3">
                                <input type="text" id="respuestaUsuario" class="form-control" placeholder="Respuesta (ej: x^2 + C)">
                            </div>
                            <button onclick="verificarRespuesta()" class="btn btn-primary">Verificar</button>
                            <button onclick="nuevoEjercicio()" class="btn btn-outline-secondary ms-2">Nuevo</button>
                            <div id="feedback" class="mt-3"></div>
                        </div>
                        <div class="col-md-6">
                            <h5>Progreso</h5>
                            <div class="progress mb-3">
                                <div id="progreso" class="progress-bar" style="width: 0%"></div>
                            </div>
                            <div id="estadisticas">
                                <p>Correctas: <span id="correctas">0</span></p>
                                <p>Incorrectas: <span id="incorrectas">0</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="text-center mt-5">
        <a href="/integrales-tutorial/index.html" class="btn btn-secondary btn-lg px-4">
            <i class="fas fa-arrow-left me-2"></i>Volver al Inicio
        </a>
    </div>
</div>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2023 Calculadora de Integrales Avanzada</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts -->
    <script src="scripts.js"></script>
</body>
</html>
